<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Medicom Machinery Catalog</title>
    <script>
      // Redirect sub-paths back to index.html for React Router to handle
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/Pharma-Machinery/' +
        '?p=' + encodeURIComponent(l.pathname.slice('/Pharma-Machinery/'.length) + l.search) +
        (l.hash ? '&h=' + encodeURIComponent(l.hash.slice(1)) : '')
      );
    </script>
  </head>
  <body></body>
</html>
